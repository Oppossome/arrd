version: "2"
sql:
  - engine: sqlite
    # sqlc reads the migrations in filename order to build the schema.
    schema: ../internal/store/migrations
    queries: ../internal/store/queries
    gen:
      go:
        package: db
        out: ../internal/store/db
        emit_json_tags: false
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        rename:
          base_url: BaseURL
          api_key: APIKey
          vpn_setting: VPNSetting
          enable_rss: EnableRSS
          caps_json: CapsJSON
          tv_categories: TVCategories
          imdb_id: IMDBID
          tmdb_id: TMDBID
          tvdb_id: TVDBID
          max_size_mb: MaxSizeMB
          tmdb_api_key: TMDBAPIKey
          expose_lan: ExposeLAN
