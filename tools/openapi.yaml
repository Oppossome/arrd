# arrd's JSON API. This file is the contract: the Go server glue
# (internal/httpapi/apigen) and the web client types (web/src/lib/api.gen.ts)
# are generated from it. After editing, run:
#   go generate ./tools
#   cd web && npm run gen:api
openapi: 3.0.3
info:
  title: arrd API
  version: "1"
  description: |
    Authentication (enforced by the server's route guards, documented per
    operation under `security`):
    - public operations have `security: []`;
    - setup operations need the setup token and only work until onboarding
      completes;
    - everything else needs the API key or a session cookie, and returns 503
      until onboarding completes. Cookie-authenticated requests that change
      state must come from the same origin.

security:
  - apiKey: []
  - apiKeyQuery: []
  - session: []

tags:
  - name: auth
  - name: setup
  - name: system
  - name: settings
  - name: rootfolders
  - name: indexers
  - name: movies
  - name: discover
  - name: series
  - name: episodes
  - name: queue
  - name: vpn

paths:
  # ------------------------------------------------------------ public
  /api/v1/health:
    get:
      operationId: health
      tags: [system]
      security: []
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/session:
    get:
      operationId: session
      tags: [auth]
      security: []
      description: What the UI should show (setup, login or the app).
      responses:
        "200":
          description: Session state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "204":
          description: Signed in; the session cookie is set.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetSessionCookie" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      security: []
      description: Ends the session. Must come from the same origin.
      responses:
        "204":
          description: Signed out; the session cookie is cleared.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetSessionCookie" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/setup/status:
    get:
      operationId: setupStatus
      tags: [setup]
      security: []
      responses:
        "200":
          description: Whether onboarding is done, and suggested paths.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------ setup
  /api/v1/setup:
    post:
      operationId: completeSetup
      tags: [setup]
      security: [{ setupToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupInput" }
      responses:
        "201":
          description: Onboarding is complete and the caller is signed in.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetSessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupResult" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/setup/validate/paths:
    post:
      operationId: validatePaths
      tags: [setup]
      security: [{ setupToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PathsInput" }
      responses:
        "200":
          description: Per-path problems; nothing is saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PathsCheck" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/setup/validate/vpn:
    post:
      operationId: validateVPN
      tags: [setup]
      security: [{ setupToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VPNInput" }
      responses:
        "200":
          description: The tunnel works.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VPNTest" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/setup/validate/tmdb:
    post:
      operationId: validateTMDB
      tags: [setup]
      security: [{ setupToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TMDBKeyRequest" }
      responses:
        "200":
          description: The key works.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidResponse" }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------- setup token or auth
  /api/v1/fs/dirs:
    get:
      operationId: listDirs
      tags: [system]
      security: [{ setupToken: [] }, { apiKey: [] }, { apiKeyQuery: [] }, { session: [] }]
      description: Subdirectories of an absolute path, for the folder picker. Hidden directories are left out.
      parameters:
        - name: path
          in: query
          description: Absolute path; defaults to /.
          schema: { type: string }
      responses:
        "200":
          description: The directory listing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirListing" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/vpn/providers:
    get:
      operationId: vpnProviders
      tags: [vpn]
      security: [{ setupToken: [] }, { apiKey: [] }, { apiKeyQuery: [] }, { session: [] }]
      responses:
        "200":
          description: VPN providers and the settings each needs.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VPNProvider" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/vpn/providers/{id}/options/{field}:
    get:
      operationId: vpnOptions
      tags: [vpn]
      security: [{ setupToken: [] }, { apiKey: [] }, { apiKeyQuery: [] }, { session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: field, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The choices for a provider's select field.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SettingOption" }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------ system
  /api/v1/status:
    get:
      operationId: status
      tags: [system]
      responses:
        "200":
          description: Whether downloads are running, and why not.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeStatus" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/posters/{size}/{file}:
    get:
      operationId: getPoster
      tags: [system]
      description: A cached TMDB poster or backdrop. Served by hand (not generated) for range and caching support.
      parameters:
        - name: size
          in: path
          required: true
          schema: { type: string, enum: [w185, w342, w500, w780, w1280], description: "w185-w500 for posters, w780 and w1280 for backdrops." }
        - { name: file, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The image.
          content:
            image/*:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------ settings
  /api/v1/settings/password:
    put:
      operationId: changePassword
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Changed; other sessions are signed out. }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/settings/general:
    get:
      operationId: getGeneralSettings
      tags: [settings]
      responses:
        "200":
          description: General settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeneralSettings" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: putGeneralSettings
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GeneralSettingsInput" }
      responses:
        "200":
          description: The saved settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeneralSettings" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/settings/api-key/regenerate:
    post:
      operationId: regenerateAPIKey
      tags: [settings]
      responses:
        "200":
          description: The new key; the old one stops working.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/APIKeyResponse" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/settings/vpn:
    get:
      operationId: getVPNSettings
      tags: [settings, vpn]
      responses:
        "200":
          description: The saved VPN and tunnel state. Secret values are never returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VPNSettings" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: putVPNSettings
      tags: [settings, vpn]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VPNInput" }
      responses:
        "200":
          description: The saved VPN.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VPNSettings" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteVPNSettings
      description: Removes the VPN. Indexer searches and downloads then use the normal connection.
      tags: [settings, vpn]
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/settings/vpn/test:
    post:
      operationId: testVPN
      tags: [settings, vpn]
      description: Tests the posted provider settings, or the running tunnel when the body is empty.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VPNInput" }
      responses:
        "200":
          description: The tunnel works.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VPNTest" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/settings/downloads:
    get:
      operationId: getDownloadSettings
      tags: [settings]
      responses:
        "200":
          description: Download settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadSettings" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: putDownloadSettings
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DownloadSettings" }
      responses:
        "200":
          description: The saved settings, with warnings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsUpdate" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/settings/quality:
    get:
      operationId: getQualitySettings
      tags: [settings]
      responses:
        "200":
          description: Quality settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QualitySettings" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: putQualitySettings
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QualitySettingsInput" }
      responses:
        "200":
          description: The saved settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QualitySettings" }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------ root folders
  /api/v1/rootfolders:
    get:
      operationId: listRootFolders
      tags: [rootfolders]
      parameters:
        - name: media_type
          in: query
          description: Defaults to movie.
          schema: { $ref: "#/components/schemas/MediaType" }
      responses:
        "200":
          description: Root folders for the media type.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RootFolder" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createRootFolder
      tags: [rootfolders]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRootFolderRequest" }
      responses:
        "201":
          description: The new root folder.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RootFolder" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/rootfolders/{id}/default:
    post:
      operationId: setDefaultRootFolder
      tags: [rootfolders]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Now the default for its media type. }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/rootfolders/{id}:
    delete:
      operationId: deleteRootFolder
      tags: [rootfolders]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------ indexers
  /api/v1/indexers:
    get:
      operationId: listIndexers
      tags: [indexers]
      responses:
        "200":
          description: All indexers.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Indexer" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createIndexer
      tags: [indexers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IndexerInput" }
      responses:
        "201":
          description: The new indexer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Indexer" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/indexers/definitions:
    get:
      operationId: indexerDefinitions
      tags: [indexers]
      security: [{ setupToken: [] }, { apiKey: [] }, { apiKeyQuery: [] }, { session: [] }]
      responses:
        "200":
          description: The sites indexers can be added for (from the definitions directory) and the settings each needs.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IndexerDefinition" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: uploadIndexerDefinitions
      tags: [indexers]
      security: [{ setupToken: [] }, { apiKey: [] }, { apiKeyQuery: [] }, { session: [] }]
      description: >-
        Adds Cardigann definitions to the definitions directory and reloads it. The body is one
        definition file, or a zip whose *.yml files (at any depth) are definitions; when the zip
        has versioned folders (definitions/v11, v12 …) only
        files in those are used, and a site in several versions comes from the newest that parses.
        Each definition replaces the file that already defines its id.
      x-max-body-bytes: 67108864
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: The definitions saved, files in the upload that were skipped, and all definitions now available.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndexerDefinitionsUpload" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/indexers/definitions/{definitionId}:
    delete:
      operationId: deleteIndexerDefinition
      tags: [indexers]
      security: [{ setupToken: [] }, { apiKey: [] }, { apiKeyQuery: [] }, { session: [] }]
      description: Deletes the file of a definition. Indexers of the site fail until it is added again.
      parameters:
        - { name: definitionId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/indexers/definitions/reload:
    post:
      operationId: reloadIndexerDefinitions
      tags: [indexers]
      security: [{ setupToken: [] }, { apiKey: [] }, { apiKeyQuery: [] }, { session: [] }]
      description: Re-reads the Cardigann definitions directory.
      responses:
        "200":
          description: The definitions now available, and definition files that were skipped.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndexerDefinitionsReload" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/indexers/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      operationId: getIndexer
      tags: [indexers]
      responses:
        "200":
          description: The indexer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Indexer" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateIndexer
      tags: [indexers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IndexerInput" }
      responses:
        "200":
          description: The updated indexer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Indexer" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteIndexer
      tags: [indexers]
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/indexers/{id}/test:
    post:
      operationId: testIndexer
      tags: [indexers]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: The indexer answered; its capabilities are refreshed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Indexer" }
        "502":
          description: The test failed (a normal outcome, not a server error).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------ movies
  /api/v1/movies/lookup:
    get:
      operationId: lookupMovies
      tags: [movies]
      parameters:
        - { $ref: "#/components/parameters/LookupQuery" }
        - { $ref: "#/components/parameters/LookupYear" }
        - { $ref: "#/components/parameters/BrowseGenre" }
        - { $ref: "#/components/parameters/BrowseLanguage" }
      responses:
        "200":
          description: TMDB matches.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LookupMovie" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/movies:
    get:
      operationId: listMovies
      tags: [movies]
      responses:
        "200":
          description: The movie library.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Movie" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: addMovie
      tags: [movies]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddMovieRequest" }
      responses:
        "201":
          description: The added movie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Movie" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/movies/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      operationId: getMovie
      tags: [movies]
      responses:
        "200":
          description: The movie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Movie" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateMovie
      tags: [movies]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMovieRequest" }
      responses:
        "200":
          description: The updated movie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Movie" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMovie
      tags: [movies]
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/movies/{id}/releases:
    get:
      operationId: movieReleases
      tags: [movies]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: Releases found by an interactive search.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResult" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/movies/{id}/search:
    post:
      operationId: searchMovie
      tags: [movies]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: The automatic search outcome.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoSearchResult" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/movies/{id}/grab:
    post:
      operationId: grabMovie
      tags: [movies]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReleaseInput" }
      responses:
        "201":
          description: The started download.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Download" }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------ discover
  /api/v1/discover/lists/movies/{list}:
    get:
      operationId: movieList
      tags: [discover]
      description: The first page (about 20) of one of TMDB's curated movie lists.
      parameters:
        - name: list
          in: path
          required: true
          schema: { $ref: "#/components/schemas/MovieList" }
      responses:
        "200":
          description: The movies on the list.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LookupMovie" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/discover/languages:
    get:
      operationId: discoverLanguages
      tags: [discover]
      responses:
        "200":
          description: The original languages TMDB knows, by English name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Language" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/discover/movies/genres:
    get:
      operationId: movieGenres
      tags: [discover]
      responses:
        "200":
          description: TMDB's movie genres.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Genre" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/discover/movies/browse:
    get:
      operationId: browseMovies
      tags: [discover]
      description: A page of TMDB movies, optionally narrowed by genre and original language, in the chosen order.
      parameters:
        - { $ref: "#/components/parameters/BrowseGenre" }
        - { $ref: "#/components/parameters/BrowseLanguage" }
        - { $ref: "#/components/parameters/BrowseSort" }
        - { $ref: "#/components/parameters/BrowsePage" }
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MovieBrowsePage" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/discover/movies/recommendations:
    get:
      operationId: movieRecommendations
      tags: [discover]
      description: >-
        TMDB's recommendations for the most recently added library movies, one
        row per movie, newest first. Movies in the library or in an earlier row
        are left out, and empty rows are dropped.
      responses:
        "200":
          description: Rows of recommended movies.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MovieRecommendations" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/discover/movies/{tmdbId}:
    get:
      operationId: discoverMovie
