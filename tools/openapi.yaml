  /api/v1/discover/series/{tmdbId}/recommendations:
    get:
      operationId: seriesLike
      tags: [discover]
      description: Series TMDB recommends to people who liked this one.
      parameters: [{ $ref: "#/components/parameters/TMDBID" }]
      responses:
        "200":
          description: The recommended series.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LookupSeries" }
